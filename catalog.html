<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalog - JK Enterprises</title>
  
  <!-- CSS Frameworks & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-sans">

  <!-- Navigation Bar -->
  <header class="bg-gray-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
      <a href="/public/index.html" class="text-2xl font-black text-yellow-400 tracking-tight">JK Enterprises</a>
      <nav class="flex gap-6 items-center">
        <a href="/public/index.html" class="hover:text-yellow-400 font-medium text-sm transition">Home</a>
        <a href="/public/catalog.html" class="hover:text-yellow-400 font-medium text-sm transition text-yellow-400">Catalog</a>
        <a href="/public/cart.html" class="bg-yellow-500 text-gray-900 px-4 py-2 rounded-lg font-bold hover:bg-yellow-400 text-sm transition shadow">
          🛒 Cart
        </a>
      </nav>
    </div>
  </header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- Catalog Header & Search Controls -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 pb-6 border-b border-gray-200">
      <div>
        <h1 id="catalog-title" class="text-3xl font-extrabold text-gray-900 tracking-tight">Catalog</h1>
        <p id="catalog-subtitle" class="text-sm text-gray-500 mt-1">Showing all available products</p>
      </div>

      <!-- Action Buttons & Clear Filters -->
      <div class="flex items-center gap-3">
        <a href="/public/catalog.html" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-semibold hover:bg-gray-200 transition">
          Reset Filters
        </a>
      </div>
    </div>

    <!-- Active Filters Pills Bar -->
    <div id="active-filters" class="flex flex-wrap items-center gap-2 mb-6 hidden">
      <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Active Filter:</span>
      <span id="filter-badge" class="inline-flex items-center gap-2 bg-blue-50 text-blue-700 text-xs font-semibold px-3 py-1.5 rounded-full border border-blue-200">
        <!-- Dynamic badge inserted here -->
      </span>
    </div>

    <!-- Products Grid -->
    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Dynamically injected via catalog-renderer.js -->
    </div>

    <!-- Catalog Pagination Container (Blog Style) -->
    <div id="catalog-pagination-container" class="mt-10">
      <!-- Dynamically injected pagination controls -->
    </div>
  </main>
  
    <!-- Dynamic Footer Injection -->
  <footer id="main-footer"></footer>

  <script src="./js/app.js"></script>
  <script src="./js/router.js"></script>
  <script src="./js/catalog-renderer.js"></script>
</body>
</html>
