<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - JK Enterprises</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-sans">

  <!-- Navigation Bar -->
  <header class="bg-gray-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
      <a href="/public/index.html" class="text-2xl font-black text-yellow-400 tracking-tight">JK Enterprises</a>
      <nav class="flex gap-6 items-center">
        <a href="/public/index.html" class="hover:text-yellow-400 font-medium text-sm transition">Home</a>
        <a href="/public/catalog.html" class="hover:text-yellow-400 font-medium text-sm transition">Catalog</a>
        <a href="/public/cart.html" class="bg-yellow-500 text-gray-900 px-4 py-2 rounded-lg font-bold hover:bg-yellow-400 text-sm transition shadow flex items-center gap-1.5">
          🛒 Cart <span id="cart-badge-count" class="bg-gray-900 text-white text-[10px] px-1.5 py-0.5 rounded-full">0</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex items-center justify-between pb-6 mb-8 border-b border-gray-200">
      <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Your Shopping Cart</h1>
      <button onclick="clearCart()" class="text-xs font-semibold text-red-600 hover:text-red-800 transition">
        Clear Cart
      </button>
    </div>

    <!-- Main Cart Layout Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- Cart Items List -->
      <div class="lg:col-span-8">
        <div id="cart-items-container" class="space-y-4"></div>
      </div>

      <!-- Order Summary Card -->
      <div class="lg:col-span-4">
        <div class="bg-white rounded-2xl p-6 border border-gray-200 shadow-sm sticky top-24 space-y-6">
          <h2 class="text-lg font-bold text-gray-900 pb-3 border-b border-gray-100">Order Summary</h2>

          <!-- Price Calculations -->
          <div class="space-y-3 text-sm text-gray-600 border-t border-gray-100 pt-4">
            <div class="flex justify-between">
              <span>Subtotal</span>
              <span id="summary-subtotal" class="font-semibold text-gray-900">₹0</span>
            </div>

            <div class="flex justify-between">
              <span>Estimated GST (18%)</span>
              <span id="summary-tax" class="font-semibold text-gray-900">₹0</span>
            </div>

            <div class="flex justify-between">
              <span>Estimated Shipping</span>
              <span id="summary-shipping" class="font-semibold text-green-600">FREE</span>
            </div>

            <div class="pt-3 border-t border-gray-100 flex justify-between text-base font-extrabold text-gray-900">
              <span>Total</span>
              <span id="summary-total" class="text-xl text-blue-600">₹0</span>
            </div>
          </div>

          <!-- Proceed to Checkout Button -->
          <a href="/public/checkout.html" id="checkout-btn" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl hover:bg-blue-700 active:scale-98 transition shadow-lg shadow-blue-200 text-sm flex items-center justify-center gap-1.5 text-center">
            Proceed to Checkout →
          </a>
        </div>
      </div>

    </div>
  </main>

  <footer id="main-footer"></footer>
  
  <script src="./js/components.js"></script>
  <script src="./js/cart-renderer.js"></script>
</body>
</html>
