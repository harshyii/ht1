<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - JK Enterprises</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <!-- CSS Frameworks & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./css/bootstrap.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-sans">

  <!-- Dynamic Header Partial -->
  <header id="main-header"></header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Breadcrumb Nav -->
    <nav class="text-sm text-gray-500 mb-6 flex items-center space-x-2">
      <a href="/public/index.html" class="hover:text-blue-600 transition">Home</a>
      <span>/</span>
      <a href="/public/catalog.html" class="hover:text-blue-600 transition">Catalog</a>
      <span>/</span>
      <a id="brand-link" href="#" class="font-semibold text-blue-600 hover:underline">Brand</a>
    </nav>

    <!-- Main Product Showcase Grid -->
    <div id="product-details" class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8 mb-10">
      
      <!-- Left Column: Gallery (5 Cols) -->
      <div class="lg:col-span-5 flex flex-col gap-4">
        <!-- Main Hero Image Box -->
        <div class="w-full h-80 sm:h-96 rounded-xl border border-gray-100 bg-gray-50 flex items-center justify-center p-4 overflow-hidden relative">
          <img id="main-product-image" src="https://via.placeholder.com/400?text=Loading..." alt="Product Image" class="max-h-full max-w-full object-contain transition-all duration-300">
        </div>
        <!-- Thumbnails Strip -->
        <div id="image-thumbnails" class="flex gap-3 overflow-x-auto py-2"></div>
      </div>

      <!-- Right Column: Info & Buy Options (7 Cols) -->
      <div class="lg:col-span-7 flex flex-col justify-between">
        <div>
          <!-- Brand Badge & Rating -->
          <div class="flex items-center justify-between gap-4 mb-2">
            <span id="product-brand-tag" class="bg-blue-50 text-blue-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider"></span>
            <div id="product-rating" class="flex items-center text-xs font-semibold text-amber-500 gap-1 bg-amber-50 px-2.5 py-1 rounded-md border border-amber-200"></div>
          </div>

          <!-- Product Title & SKU -->
          <h1 id="product-title" class="text-2xl sm:text-3xl font-extrabold text-gray-900 leading-tight mb-2">Loading Product Details...</h1>
          <p id="product-sku" class="text-xs font-mono text-gray-400 mb-6"></p>

          <!-- Pricing Section -->
          <div class="bg-gray-50 rounded-xl p-4 border border-gray-100 flex items-baseline gap-4 mb-6">
            <span id="product-price" class="text-3xl sm:text-4xl font-extrabold text-gray-900"></span>
            <span id="product-mrp" class="text-lg text-gray-400 line-through"></span>
            <span id="product-discount" class="bg-red-100 text-red-700 font-bold text-xs px-2.5 py-1 rounded-md"></span>
          </div>

          <!-- Short Description -->
          <p id="product-description" class="text-sm text-gray-600 leading-relaxed mb-6"></p>
        </div>

        <!-- Quantity & Call to Actions -->
        <div class="pt-4 border-t border-gray-100 flex flex-col gap-4">
          <!-- Quantity Control -->
          <div class="flex items-center gap-3">
            <label for="product-qty-input" class="text-xs font-bold text-gray-700 uppercase tracking-wider">Quantity:</label>
            <input type="number" id="product-qty-input" min="1" max="99" value="1" class="w-20 px-3 py-1.5 border border-gray-300 rounded-lg text-sm font-semibold text-center focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

          <!-- Action Buttons -->
          <div class="flex flex-col sm:flex-row gap-4">
            <button id="add-to-cart-btn" class="flex-1 bg-yellow-500 text-gray-900 font-extrabold py-3.5 px-6 rounded-xl hover:bg-yellow-400 shadow-md transition flex justify-center items-center gap-2">
              <i class="fa-solid fa-cart-plus"></i> Add to Cart
            </button>
            <a id="bulk-order-btn" href="#" target="_blank" rel="noopener noreferrer" class="flex-1 bg-gray-900 text-white font-bold py-3.5 px-6 rounded-xl hover:bg-black transition flex justify-center items-center gap-2 text-sm text-center">
              <i class="fa-brands fa-whatsapp text-green-400 text-lg"></i> Bulk Order Inquiry
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Specifications Table Section -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8 mb-8">
      <h2 class="text-xl font-bold text-gray-900 mb-6 pb-3 border-b border-gray-100 flex items-center gap-2">
        <i class="fa-solid fa-list-check text-blue-600"></i> Technical Specifications
      </h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-600 border-collapse">
          <tbody id="specs-table-body" class="divide-y divide-gray-100">
            <!-- Dynamically populated -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Customer Reviews Section -->
    <section class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8">
      <div class="flex items-center justify-between pb-4 border-b border-gray-100 mb-6">
        <h2 class="text-xl font-bold text-gray-900 flex items-center gap-2">
          <i class="fa-solid fa-comments text-blue-600"></i> Customer Reviews
        </h2>
        <span id="reviews-count-badge" class="bg-gray-100 text-gray-700 text-xs font-semibold px-2.5 py-1 rounded-full">
          0 Reviews
        </span>
      </div>

      <!-- Reviews List Container & Integrated Pagination -->
      <div id="reviews-container" class="space-y-6">
        <!-- Dynamically loaded with blog-style pagination controls -->
      </div>
    </section>
  </main>

  <!-- Dynamic Footer Partial -->
  <footer id="main-footer"></footer>

  <!-- Scripts -->
  <script src="./js/app.js"></script>
  <script src="./js/product-renderer.js"></script>
  <script src="./js/bootstrap.bundle.min.js"></script>
</body>
</html>
